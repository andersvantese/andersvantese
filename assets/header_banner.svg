<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="sig-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow-ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="sig-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="avatar-clip">
      <circle cx="110" cy="150" r="72"/>
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title-text { font-weight: 800; letter-spacing: -0.5px; }
    .tag-text { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
    .creed-text { font-size: 13.5px; font-weight: 500; }
    .badge-pill { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
  </style>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="876" height="296" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Ambient Mesh Glows -->
  <circle cx="130" cy="90" r="100" fill="#00D2FF" fill-opacity="0.08" filter="url(#glow-ambient)"/>
  <circle cx="780" cy="80" r="120" fill="#8B5CF6" fill-opacity="0.09" filter="url(#glow-ambient)"/>
  <circle cx="500" cy="240" r="110" fill="#2563EB" fill-opacity="0.06" filter="url(#glow-ambient)"/>

  <!-- Subtle Grid Pattern in Header -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.8">
    <line x1="240" y1="20" x2="860" y2="20" />
    <line x1="240" y1="70" x2="860" y2="70" />
    <line x1="240" y1="120" x2="860" y2="120" />
    <line x1="240" y1="170" x2="860" y2="170" />
    <line x1="240" y1="220" x2="860" y2="220" />
    <line x1="240" y1="270" x2="860" y2="270" />
    <line x1="320" y1="2" x2="320" y2="296" />
    <line x1="440" y1="2" x2="440" y2="296" />
    <line x1="560" y1="2" x2="560" y2="296" />
    <line x1="680" y1="2" x2="680" y2="296" />
    <line x1="800" y1="2" x2="800" y2="296" />
  </g>

  <!-- Left: Avatar Ring & Image Frame -->
  <circle cx="110" cy="150" r="77" fill="none" stroke="url(#sig-grad)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="110" cy="150" r="82" fill="none" stroke="#00D2FF" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="110" cy="150" r="72" fill="#0A1120"/>
  
  <!-- Avatar Image Embedded -->
  <image href="assets/avatar.png" x="38" y="78" width="144" height="144" clip-path="url(#avatar-clip)"/>

  <!-- Online / Status Dot -->
  <circle cx="164" cy="204" r="8" fill="#080C15" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="164" cy="204" r="5" fill="#10B981"/>

  <!-- Center Content: Identity & Title -->
  <g transform="translate(225, 0)">
    <!-- Top System Subheader -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="280" height="22" rx="11" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#00D2FF"/>
      <text x="24" y="15" fill="#38BDF8" class="font-mono tag-text">TECH FOUNDER &amp; SYSTEMS SPECIALIST</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="112" fill="url(#name-grad)" class="font-sans title-text" font-size="44">Anders Vantese</text>

    <!-- Subtitle Creed (from Avatar) -->
    <g transform="translate(0, 142)">
      <text x="0" y="0" fill="#64748B" class="font-mono creed-text">&gt;</text>
      <text x="18" y="0" fill="#00D2FF" class="font-mono creed-text">// build</text>
      <text x="86" y="0" fill="#475569" class="font-mono creed-text">•</text>
      <text x="100" y="0" fill="#38BDF8" class="font-mono creed-text">test</text>
      <text x="144" y="0" fill="#475569" class="font-mono creed-text">•</text>
      <text x="158" y="0" fill="#818CF8" class="font-mono creed-text">learn</text>
      <text x="208" y="0" fill="#475569" class="font-mono creed-text">•</text>
      <text x="222" y="0" fill="#A855F7" class="font-mono creed-text">ship</text>
      <text x="264" y="0" fill="#00D2FF" class="font-mono creed-text">_</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(0, 178)">
      <!-- Pill 1: Clean-Room -->
      <g transform="translate(0, 0)">
        <rect width="138" height="28" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#10B981"/>
        <text x="26" y="18" fill="#E2E8F0" class="font-mono badge-pill">Clean-Room Eng</text>
      </g>

      <!-- Pill 2: Ghost Protocol -->
      <g transform="translate(148, 0)">
        <rect width="128" height="28" rx="8" fill="#130D2B" stroke="#2E1065" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#A855F7"/>
        <text x="26" y="18" fill="#E2E8F0" class="font-mono badge-pill">Ghost Protocol</text>
      </g>

      <!-- Pill 3: High Precision -->
      <g transform="translate(286, 0)">
        <rect width="124" height="28" rx="8" fill="#0A192F" stroke="#1E3A8A" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#38BDF8"/>
        <text x="26" y="18" fill="#E2E8F0" class="font-mono badge-pill">Quant &amp; Systems</text>
      </g>

      <!-- Pill 4: HealthTech -->
      <g transform="translate(420, 0)">
        <rect width="102" height="28" rx="8" fill="#061B1C" stroke="#134E4A" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#14B8A6"/>
        <text x="26" y="18" fill="#E2E8F0" class="font-mono badge-pill">HealthTech</text>
      </g>
    </g>

    <!-- Bottom Institutional Line -->
    <g transform="translate(0, 240)">
      <line x1="0" y1="0" x2="520" y2="0" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="24" fill="#64748B" class="font-mono" font-size="11">CENTRAL REPOSITORY &amp; ARCHITECTURAL LAB // ANDERS VANTESE ECOSYSTEM</text>
    </g>
  </g>

  <!-- Top-Right: Monogram Watermark 'AV' Signature -->
  <g transform="translate(730, 36)" opacity="0.85" filter="url(#sig-glow)">
    <path d="M15 80 L45 10 L75 80 M27 52 L63 52" stroke="url(#sig-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M68 10 L88 78 L108 10" stroke="url(#sig-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="35" y="105" fill="#94A3B8" class="font-mono" font-size="10" letter-spacing="3" text-anchor="middle">VERIFIED</text>
  </g>
</svg>
